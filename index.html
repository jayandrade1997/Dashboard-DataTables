<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de ventas</title>

  <!-- Estilos de las librerias (copia local en lib/) -->
  <link rel="stylesheet" href="lib/dataTables.dataTables.min.css">
  <link rel="stylesheet" href="lib/buttons.dataTables.min.css">
  <link rel="stylesheet" href="lib/responsive.dataTables.min.css">
  <!-- Estilos propios, siempre despues de los de las librerias -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <h1>Dashboard de ventas</h1>
    <p>Ventas simuladas de enero a junio de 2026. Filtra la tabla y mira cómo cambian las gráficas.</p>
  </header>

  <main class="contenedor">

    <!-- Tarjetas de resumen -->
    <section class="tarjetas" aria-label="Resumen">
      <article class="tarjeta"><span class="tarjeta-titulo">Total vendido</span><strong id="kpiTotal">-</strong></article>
      <article class="tarjeta"><span class="tarjeta-titulo">Pedidos</span><strong id="kpiPedidos">-</strong></article>
      <article class="tarjeta"><span class="tarjeta-titulo">Ticket promedio</span><strong id="kpiTicket">-</strong></article>
      <article class="tarjeta"><span class="tarjeta-titulo">Pedidos pagados</span><strong id="kpiPagados">-</strong></article>
    </section>

    <!-- Graficas -->
    <section class="graficas" aria-label="Gráficas">
      <article class="panel">
        <div class="panel-cabecera">
          <h2>Ventas por categoría</h2>
          <button type="button" id="btnTipo" class="boton-secundario">Ver como torta</button>
        </div>
        <div class="caja-grafica"><canvas id="gCategorias"></canvas></div>
      </article>

      <article class="panel">
        <div class="panel-cabecera"><h2>Ventas por mes</h2></div>
        <div class="caja-grafica"><canvas id="gMeses"></canvas></div>
      </article>
    </section>

    <!-- Filtros y tabla -->
    <section class="panel" aria-label="Tabla de ventas">
      <div class="filtros">
        <label>Categoría <select id="fCategoria"></select></label>
        <label>Ciudad <select id="fCiudad"></select></label>
        <label>Estado <select id="fEstado"></select></label>
        <label>Desde <input type="date" id="fDesde"></label>
        <label>Hasta <input type="date" id="fHasta"></label>
        <button type="button" id="btnLimpiar" class="boton-secundario">Limpiar filtros</button>
      </div>

      <table id="tabla" class="display nowrap" style="width:100%"></table>
    </section>

  </main>

  <footer class="pie">Datos simulados con fines académicos.</footer>

  <!-- Librerias (copia local). Para usar CDN ver README.md -->
  <script src="lib/jquery.min.js"></script>
  <script src="lib/dataTables.min.js"></script>
  <script src="lib/dataTables.buttons.min.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="lib/pdfmake.min.js"></script>
  <script src="lib/vfs_fonts.js"></script>
  <script src="lib/buttons.html5.min.js"></script>
  <script src="lib/dataTables.responsive.min.js"></script>
  <script src="lib/chart.umd.js"></script>

  <!-- Codigo propio, el orden importa -->
  <script src="js/datos.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/tabla.js"></script>
  <script src="js/graficas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
